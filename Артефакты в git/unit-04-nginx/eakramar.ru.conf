server {
       server_name eakramar.ru www.eakramar.ru;
       root /var/www/eakramar.ru;
       index index.html;

       access_log /var/log/nginx/eakramar.access.log;
       error_log /var/log/nginx/eakramar.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eakramar.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eakramar.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        location /app/ {
                proxy_pass http://localhost:3000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1000;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;

}
server {
    if ($host = www.eakramar.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = eakramar.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


       listen 80;
       server_name eakramar.ru www.eakramar.ru;
    return 404; # managed by Certbot




}